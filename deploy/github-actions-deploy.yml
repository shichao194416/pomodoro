name: Deploy 番茄钟 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the app
        id: appdir
        run: |
          if [ -f pomodoro-app/package.json ]; then
            echo "dir=pomodoro-app" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ steps.appdir.outputs.dir }}
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ${{ steps.appdir.outputs.dir }}
        run: npm test

      - name: Build
        working-directory: ${{ steps.appdir.outputs.dir }}
        env:
          # GitHub Pages project sites live at /<repo>/, so the asset base has
          # to match or every script and icon 404s.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.appdir.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
