# Netlify configuration for 番茄钟
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify serves the site from the domain root, so the asset base is "/".
  # (Do NOT set VITE_BASE here — that is only needed for GitHub Pages
  #  project sites, which live under /<repo>/.)
  NODE_VERSION = "22"

# Single-page app: every unknown path falls back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and the manifest must never be cached, or the installed
# app keeps running an old build forever.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
