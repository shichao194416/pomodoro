<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>番茄钟 · iPhone 尺寸预览</title>
    <style>
      body {
        margin: 0;
        padding: 22px;
        background: #1b2126;
        color: #dfe6ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 26px;
        align-items: flex-start;
      }
      .device {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .label {
        font-size: 13px;
        opacity: 0.75;
      }
      .screen {
        border: 10px solid #000;
        border-radius: 40px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55);
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="device">
      <span class="label">iPhone 横屏 844 × 390</span>
      <div class="screen"><iframe src="/" width="844" height="390"></iframe></div>
    </div>
    <div class="device">
      <span class="label">iPhone 竖屏 390 × 844（应显示横屏提示）</span>
      <div class="screen"><iframe src="/" width="390" height="844"></iframe></div>
    </div>
  </body>
</html>
